<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#254687">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TOTVS Lynn">
    <link rel="manifest" href="manifest.json">

    <title>App Atendimento - TOTVS</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #ffffff;
        }
        .chat-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        class="chat-frame"
        src="https://support-agent-698008485131.us-central1.run.app/" 
        allow="microphone; camera">
    </iframe>

    <!-- Script para registrar o Service Worker e liberar a instalação -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
            .then(() => console.log("Service Worker Registrado!"))
            .catch((err) => console.log("Erro no Service Worker:", err));
        }
    </script>

</body>
</html>
